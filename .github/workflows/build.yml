name: Build Buku Barang APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Scaffolding & Generate BB App Icon
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart lib/main.dart.bak
          flutter create --platforms=android --org=com.natanael.bukubarang .
          mv pubspec.yaml.bak pubspec.yaml
          mv lib/main.dart.bak lib/main.dart
          
          pip install pillow
          python3 -c "
          import os
          from PIL import Image, ImageDraw, ImageFont

          size = 512
          img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          bg_color = (56, 189, 248, 255) # Biru Muda (#38BDF8)
          radius = int(size * 0.22)
          draw.rounded_rectangle([(0, 0), (size, size)], radius=radius, fill=bg_color)
          draw.rounded_rectangle([(4, 4), (size - 4, size - 4)], radius=radius - 2, outline=(2, 132, 199, 255), width=int(size * 0.02))

          try:
              font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', int(size * 0.46))
          except Exception:
              font = ImageFont.load_default()

          bbox = draw.textbbox((0, 0), 'BB', font=font)
          tw = bbox - bbox[0]
          th = bbox - bbox
          x = (size - tw) / 2 - bbox[0]
          y = (size - th) / 2 - bbox
          draw.text((x, y), 'BB', font=font, fill=(255, 255, 255, 255))

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          res_dir = 'android/app/src/main/res'
          for folder, s in sizes.items():
              p = os.path.join(res_dir, folder)
              os.makedirs(p, exist_ok=True)
              resized = img.resize((s, s), Image.Resampling.LANCZOS)
              resized.save(os.path.join(p, 'ic_launcher.png'))
          print('Custom BB Launcher Icons generated successfully!')
          "
          flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buku-Barang-by-Natanael-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: Buku Barang v1.0.0 by Natanael
          body: "Aplikasi Buku Barang (BB) untuk pencatatan barang masuk dari pekerja dan rekap upah. 100% Offline."
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
